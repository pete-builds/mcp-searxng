name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-pypi:
    name: Build + Publish to PyPI
    runs-on: ubuntu-latest
    # PyPI Trusted Publisher requires id-token: write and an environment.
    # Configure the trusted publisher under PyPI project settings:
    #   project name:      mcp-searxng-vet
    #   workflow filename: release.yml
    #   environment name:  pypi
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-searxng-vet
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build wheel + sdist
        run: python -m build

      - name: Publish to PyPI via Trusted Publisher (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
