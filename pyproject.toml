[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mcp-searxng"
version = "0.2.0"
description = "MCP server wrapping a self-hosted SearXNG instance. Web/news/tech/image/video search, multi-page consensus ranking, URL→markdown reading, and an 8-angle person fan-out for due diligence."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pete Stergion", email = "pstergion@gmail.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "searxng", "search", "claude", "due-diligence", "vet", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=3.1.0",
    "httpx>=0.28.1",
    "uvicorn>=0.41.0",
    "python-dotenv>=1.1.0",
    "trafilatura>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
mcp-searxng = "mcp_searxng.server:main"

[project.urls]
Homepage = "https://github.com/pete-builds/mcp-searxng"
Repository = "https://github.com/pete-builds/mcp-searxng"
Issues = "https://github.com/pete-builds/mcp-searxng/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_searxng"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/.env.example",
]
