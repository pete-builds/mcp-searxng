[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "mcp-searxng"
version = "0.2.0"
description = "MCP server wrapping a self-hosted SearXNG instance. Web/news/tech/image/video search, multi-page consensus ranking, URL→markdown reading, and an 8-angle person fan-out for due diligence."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pete Stergion", email = "pstergion@gmail.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "searxng", "search", "claude", "due-diligence", "vet", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=3.4.4",
    "httpx>=0.28.1",
    "uvicorn>=0.51.0",
    "python-dotenv>=1.1.0",
    "trafilatura>=2.1.0",
    # Pinned to an immutable commit tarball until pete-mcp-core is on PyPI.
    # Revert to "pete-mcp-core>=0.1.0" once it publishes.
    "pete-mcp-core @ https://github.com/pete-builds/pete-mcp-core/archive/15d210625cfcf1840b6b6e95cf10990214585104.tar.gz",
]

[project.optional-dependencies]
dev = [
    "build>=1.5.0",
    "twine>=6.2.0",
    "ruff>=0.16.2,<0.17",
    "pytest>=9.1.1",
]

[project.scripts]
mcp-searxng = "mcp_searxng.server:main"

[project.urls]
Homepage = "https://github.com/pete-builds/mcp-searxng"
Repository = "https://github.com/pete-builds/mcp-searxng"
Issues = "https://github.com/pete-builds/mcp-searxng/issues"

[tool.hatch.metadata]
# Required for the pete-mcp-core commit-tarball pin above. Can be dropped
# once that dependency reverts to a plain PyPI version specifier.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_searxng"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/.env.example",
]
