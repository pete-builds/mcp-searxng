services:
  mcp-searxng:
    # Pull the published image by default. To build locally instead, comment
    # out `image:` and uncomment `build: .`.
    image: ghcr.io/pete-builds/mcp-searxng:0.2.1
    # build: .
    container_name: mcp-searxng
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=${FASTMCP_PORT:-3702}
      - TZ=${TZ:-America/New_York}
