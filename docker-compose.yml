services:
  mcp-searxng:
    # Pull the published image by default. To build locally instead, comment
    # out `image:` and uncomment `build: .`.
    image: ghcr.io/pete-builds/mcp-searxng:0.5.0
    # build: .
    container_name: mcp-searxng
    restart: unless-stopped
    network_mode: host
    # .env must exist and must set SEARXNG_URL and MCP_AUTH_TOKEN (see
    # .env.example). The server refuses to start over HTTP with no bearer
    # token, so without it this container exits and restarts in a loop.
    # The token belongs in .env only (chmod 600 .env): never in this file,
    # never in git.
    env_file:
      - .env
    environment:
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=${FASTMCP_PORT:-3702}
      - TZ=${TZ:-America/New_York}
